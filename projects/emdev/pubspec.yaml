name: emdev
publish_to: none
description: CLI tools for managing the EmberLight monorepo.
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.7.0
  ansicolor: ^2.0.3
  yaml: ^3.1.3
  path: ^1.9.1
  xdg_directories: ^1.1.0

  ember_cli_utils:
    path: ../../packages/ember_cli_utils

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.0

executables:
  emdev: # This allows running `dart pub global activate --source path .` and then `emdev.exe`