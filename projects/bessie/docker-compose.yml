version: '3.8'

services:
  bessie-web:
    build:
      context: ../../  # Build from monorepo root
      dockerfile: projects/bessie/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount source code for hot reload (from monorepo root)
      - ../../:/app
      # Exclude build directories to avoid conflicts
      - /app/projects/bessie/build
      - /app/.dart_tool
    environment:
      - FLUTTER_WEB_PORT=8080
      - FLUTTER_WEB_HOSTNAME=0.0.0.0
      - DEBUG=01310
    stdin_open: true
    tty: true
    depends_on:
      - firebase-emulator
    networks:
      - bessie-network

  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    ports:
      - "4000:4000"   # Emulator UI
      - "6200:6200"   # Firestore emulator
      - "9099:9099"   # Auth emulator
    volumes:
      - .:/app  # Current directory (projects/bessie)
      - firebase-data:/data
    working_dir: /app
    command: firebase emulators:start --import /data --export-on-exit /data
    environment:
      - FIREBASE_PROJECT=bessie-camp-app
    networks:
      - bessie-network

volumes:
  firebase-data:

networks:
  bessie-network:
    driver: bridge
