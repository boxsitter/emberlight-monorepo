name: 🕸 Build & Deploy Web

on:
  push:
    branches:
      - release/web

env:
  PROJECT_DIR: projects/bessie # This is from your existing workflow file
  PUB_CACHE: ~/.pub-cache
  # CORRECTED: Use the full GitHub SHA for the Sentry release version
  SENTRY_RELEASE_VERSION: bessie-web-${{ github.sha }}

concurrency:
  group: build-and-deploy-${{ github.ref }} # Using GitHub.ref to make it per-branch
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v3 # You can update to @v4 if you prefer
        with:
          fetch-depth: 0 # Sentry needs a full history

      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ${{ github.workspace }}/${{ env.PROJECT_DIR }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build web
        run: flutter build web --release

      - name: Prepare public folder
        run: |
          rm -rf public
          mv build/web public

      # SENTRY INTEGRATION: Create Release and Upload Source Maps
      - name: Create Sentry Release and Upload Source Maps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          sourcemaps: ${{ env.PROJECT_DIR }}/public
          version: ${{ env.SENTRY_RELEASE_VERSION }} # Uses the corrected version from env
          environment: production
          finalize: true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BESSIE_CAMP_APP }}
          projectId: bessie-camp-app
          channelId: live
          entryPoint: ${{ env.PROJECT_DIR }}