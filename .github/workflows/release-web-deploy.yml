name: 🕸 Build & Deploy Web

on:
  push:
    branches:
      - release/web

env:
  PROJECT_DIR: projects/bessie
  PUB_CACHE: ~/.pub-cache

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        # Commands will run in the context of your Flutter app directory
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v3
        # This step now checks out the entire monorepo (emberlight-monorepo)
        # No 'path' is specified, so it checks out to the root of the GITHUB_WORKSPACE

      # The separate checkout steps for ember_core and ember_fire are removed
      # as they are now part of the monorepo and included in the main checkout.
      # The 'bess_ui' package is also assumed to be part of this monorepo checkout.

      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PUB_CACHE }} # Path to the global pub cache
            ${{ github.workspace }}/${{ env.PROJECT_DIR }}/.dart_tool # Path to project specific .dart_tool
          # The key now uses pubspec files from within the PROJECT_DIR (apps/bessie)
          key: ${{ runner.os }}-pub-${{ hashFiles('${{ github.workspace }}/${{ env.PROJECT_DIR }}/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Optional: Specify Flutter version if needed, e.g., flutter-version: '3.19.0'

      - name: Flutter pub get
        run: flutter pub get
        # This runs in ${{ env.PROJECT_DIR }} (apps/bessie) due to the 'defaults'

      - name: Flutter build web
        run: flutter build web --release
        # This runs in ${{ env.PROJECT_DIR }} (apps/bessie)

      - name: Prepare public folder
        run: |
          rm -rf public
          mv build/web public
        # This runs in ${{ env.PROJECT_DIR }} (apps/bessie), so it correctly
        # creates apps/bessie/public from apps/bessie/build/web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BESSIE_CAMP_APP }}
          projectId: bessie-camp-app
          channelId: live
          # entryPoint points to your Flutter app directory relative to the repo root
          # This tells Firebase where to find firebase.json and the 'public' folder
          entryPoint: ${{ env.PROJECT_DIR }}