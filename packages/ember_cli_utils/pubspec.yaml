#file: noinspection SpellCheckingInspection
name: ember_cli_utils
description: Shared utilities for building EmberDev and EmberCore CLI tools, including rich input/output and command structures.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # For basic argument parsing in the actual CLIs that will use this util package
  args: ^2.7.0

  # For styled text output
  ansicolor: ^2.0.3

  # For tabular data output
  tabular: ^0.6.3+1 # Or other table packages like text_table

  # For path manipulation
  path: ^1.9.1

  cli_util: ^0.4.2
  
  completion: ^1.0.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
