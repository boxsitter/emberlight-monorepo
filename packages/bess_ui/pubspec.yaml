version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  ember_core:
    path: ../ember_core

  ember_cli_utils:
    path: ../ember_cli_utils

  # UI
  shadcn_ui: ^0.26.5

  # Utility Packages
  lottie: ^3.3.1
  shimmer: ^3.0.0
  # clipboard: ^0.1.3
  # image_picker: ^1.1.0
  # url_launcher: ^6.2.6
  # flutter_dropzone: ^4.2.1
  # flutter_typeahead: ^5.2.0
  # connectivity_plus: ^6.0.3
  # multi_select_flutter: ^4.1.3
  cached_network_image: ^3.4.1
  # flutter_native_splash: ^2.4.0
  # smooth_page_indicator: ^1.1.0
  window_manager: ^0.4.3
  # synchronized: ^3.0.0
  rxdart: ^0.28.0
  xterm: ^4.0.0
  ansicolor: ^2.0.3

  # Web Specific
  web: ^1.1.1

  # State Management
  get: ^4.7.2
  # get_storage: ^2.1.1

  sentry_flutter: ^8.14.2


dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

